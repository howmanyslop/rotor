name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: blacksmith-16vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l internal cmd tools)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./internal/... ./cmd/... ./tools/...

      - name: Build
        run: go build ./...

      - name: Sidecar tests
        run: node --test test/*.test.js
        working-directory: tools/sidecar

      - name: Test
        run: go test ./... -count=1
        env:
          # The setup action installs testdata/transformers/project, so the
          # real-package transformer test must run here, never skip.
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

  windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      - name: Sidecar tests
        shell: bash
        working-directory: tools/sidecar
        run: |
          set -o pipefail
          node --test test/*.test.js 2>&1 | tee "$RUNNER_TEMP/sidecar-test.log"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee "$RUNNER_TEMP/go-test.log"
        env:
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            ${{ runner.temp }}/sidecar-test.log
            ${{ runner.temp }}/go-test.log
          if-no-files-found: ignore

  race:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up rotor toolchain
        uses: ./.github/actions/setup

      - name: Race detector
        run: go test -race -shuffle=on -count=1 ./internal/logservice ./internal/compile ./cmd/rotor
        env:
          # The setup action installs testdata/transformers/project, so the
          # real-package transformer test must run here, never skip.
          ROTOR_REQUIRE_TRANSFORMERS_FIXTURE: "1"

  vuln:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Reachability-scoped scan of the whole module (rotor + vendored tsgo):
        # fails the build only for advisories on code paths rotor can actually
        # execute.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
