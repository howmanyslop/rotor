[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]

[settings]
auto_install = false
lockfile = true

[tools]
"github:rojo-rbx/rojo" = "7.6.1"
"github:lune-org/lune" = "0.10.1"
go = "1.26.5"
goreleaser = "latest"

[tasks."build:one-shot"]
description = "Remove the supplied project's out directory, then run a one-shot (non-watch) rotor build --json with --checkers 1 and --checkers 4. Usage: mise run build:one-shot -- <project-dir> <tsconfig-path> (tsconfig path relative to the project dir)."
usage = '''
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
'''
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
    echo "error: project directory not found: $project" >&2
    exit 1
}
[ -f "$project/$tsconfig" ] || {
    echo "error: tsconfig not found: $project/$tsconfig" >&2
    exit 1
}

rm -rf "$project/out"
go run ./cmd/rotor build --project "$project/$tsconfig" --json --checkers 1

rm -rf "$project/out"
go run ./cmd/rotor build --project "$project/$tsconfig" --json --checkers 4

# Run with `--checkers` equal to the number of CPU cores

rm -rf "$project/out"
go run ./cmd/rotor build --project "$project/$tsconfig" --json --checkers "$(nproc)"
'''

[tasks."build:solution"]
description = "Remove the supplied project's out directory, then run a solution (project references) rotor build --build --json with --builders 1 and --builders 3 at a fixed --checkers 1. Usage: mise run build:solution -- <project-dir> <tsconfig-path> (tsconfig path relative to the project dir)."
usage = '''
arg "<project-dir>" help="External project directory"
arg "<tsconfig-path>" help="Path to tsconfig relative to the project directory"
'''
run = '''
set -euo pipefail

readonly project=$usage_project_dir
readonly tsconfig=$usage_tsconfig_path

[ -d "$project" ] || {
    echo "error: project directory not found: $project" >&2
    exit 1
}
[ -f "$project/$tsconfig" ] || {
    echo "error: tsconfig not found: $project/$tsconfig" >&2
    exit 1
}

rm -rf "$project/out"
go run ./cmd/rotor build --build "$project/$tsconfig" --builders 1 --checkers 1 --json

rm -rf "$project/out"
go run ./cmd/rotor build --build "$project/$tsconfig" --builders 3 --checkers 1 --json
'''
